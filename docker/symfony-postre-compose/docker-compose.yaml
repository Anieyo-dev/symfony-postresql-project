services:
  web:
    image: shinsenter/symfony:latest
    container_name: symfony_project
    networks:
      # network specified to avoid used ports
      statgate_net:
        ipv4_address: 172.55.0.2
    volumes:
      - symfony_project_files:/var/www/html
    secrets:
      - source: apache-selfsigned-crt
        target: /etc/apache2/ssl/laravel/apache-selfsigned.crt
      - source: apache-selfsigned-key
        target: /etc/apache2/ssl/laravel/apache-selfsigned.key
    depends_on:
      - symfony_db
    env_file:
      - ../config/.env.dev

  symfony_db:
    image: postgres:18.6
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    volumes:  
      - symfony_pg_data:/var/lib/postgresql
    networks:
      # network specified to avoid used ports
      statgate_net:
        ipv4_address: 172.55.0.3
    env_file:
      - ../config/.env.dev

  adminer:
    image: adminer
    networks:
      # network specified to avoid used ports
      statgate_net:
        ipv4_address: 172.55.0.4
    depends_on:
      - symfony_db
    ports:
      - 8080:8080

# networks used at project to avoid used ports.
networks:
  statgate_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.55.0.0/16

# Volumes for composer
volumes:
  symfony_pg_data:
  symfony_project_files:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ../../symfony

# Secrets for local ssl
secrets:
  apache-selfsigned-crt:
    file: ../apache2/ssl/certs/apache-selfsigned.crt
  apache-selfsigned-key:
    file: ../apache2/ssl/private/apache-selfsigned.key